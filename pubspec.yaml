name: housypoint_v2
description: "Housy Point — real estate app (V2)."
publish_to: 'none'

# build-name+build-number → versionName/versionCode (Android),
# CFBundleShortVersionString/CFBundleVersion (iOS)
version: 2.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  # State & navigation
  provider: ^6.1.5+1
  go_router: ^18.1.0

  # Networking & storage
  dio: ^5.11.1
  http_parser: ^4.1.2
  flutter_secure_storage: ^11.2.0
  shared_preferences: ^2.5.6

  # Firebase
  firebase_core: ^5.0.0
  firebase_crashlytics: ^6.0.0
  firebase_messaging: ^17.0.0
  firebase_remote_config: ^7.0.0
  flutter_local_notifications: ^22.3.2

  # UI
  google_fonts: ^8.2.1
  iconsax_flutter: ^1.0.1
  cupertino_icons: ^1.0.8
  lottie: ^3.6.1
  cached_network_image: ^4.0.3

  # Device & platform
  country_picker: ^2.0.28
  device_info_plus: ^13.3.0
  file_picker: ^13.1.0
  package_info_plus: ^10.2.2
  share_plus: ^13.3.1
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/logo/housypoint_logo.png
    - assets/lottie/

# App icon — regenerate with `dart run flutter_launcher_icons`
flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/logo/housypoint_logo.png"
  remove_alpha_ios: true
  min_sdk_android: 21
